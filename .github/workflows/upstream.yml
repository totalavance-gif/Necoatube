name: Upstream

on:
  schedule:
    - cron: "20 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Version check
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUR=$(grep -o "NewPipeExtractor:v[0-9.]*" app/build.gradle | head -n1 | cut -d: -f2)
          LAT=$(curl -s https://jitpack.io/com/github/TeamNewPipe/NewPipeExtractor/maven-metadata.xml \
            | grep -o "<version>v[0-9.]*</version>" | grep -o "v[0-9.]*" | sort -uV | tail -n1)
          echo "current=$CUR latest=$LAT"
          echo "cur=$CUR" >> "$GITHUB_OUTPUT"
          echo "lat=$LAT" >> "$GITHUB_OUTPUT"
          if [ -z "$LAT" ]; then
            echo "state=unknown" >> "$GITHUB_OUTPUT"
            echo "no se pudo leer jitpack"
            exit 0
          fi
          if [ "$CUR" != "$LAT" ]; then
            echo "state=new" >> "$GITHUB_OUTPUT"
            OPEN=$(gh issue list --search "NewPipeExtractor $LAT in:title" --state open \
              --json number -q '.[].number' | head -n1)
            if [ -z "$OPEN" ]; then
              gh issue create \
                --title "Upstream: NewPipeExtractor $LAT disponible (tenemos $CUR)" \
                --body "JitPack publica $LAT. Actualizar app/build.gradle, correr el test de salud y soltar release para que la app avise."
            else
              echo "ya existe #$OPEN"
            fi
          else
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            echo "al día"
            gh issue list --search "Upstream: NewPipeExtractor in:title" --state open \
              --json number -q '.[].number' | xargs -r -n1 gh issue close
          fi

      - name: Health test
        id: health
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest \
            --tests "com.nexos.play.data.ExtractorHealthTest" \
            --stacktrace 2>&1 | tee health.log
          CODE=$?
          if grep -q "INCONCLUSIVE" health.log; then STATE=inconclusive
          elif [ "$CODE" -eq 0 ]; then STATE=ok
          else STATE=broken; fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "health=$STATE code=$CODE"
          if [ "$STATE" = "inconclusive" ]; then exit 0; fi
          exit "$CODE"

      - name: Report breakage
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'El test de salud del extractor falló (YouTube pudo haber roto la extracción):'
            echo '```'
            grep -E "FAILED|AssertionError|Exception|INCONCLUSIVE|hits=|video=|tendencias=|^e: " health.log | tail -n 30
            echo '```'
          } > health-report.md
          OPEN=$(gh issue list --search "Upstream: extractor roto in:title" --state open \
            --json number -q '.[].number' | head -n1)
          if [ -z "$OPEN" ]; then
            gh issue create --title "Upstream: extractor roto?" --body-file health-report.md
          else
            echo "ya existe #$OPEN"
          fi

      - name: Update STATUS.md
        if: always()
        run: |
          NOW=$(date -u "+%Y-%m-%d %H:%M UTC")
          case "${{ steps.version.outputs.state }}" in
            new) VROW="🆕 hay nueva" ;;
            uptodate) VROW="✅ al día" ;;
            *) VROW="⚠️ sin dato" ;;
          esac
          case "${{ steps.health.outputs.state }}" in
            ok) HROW="✅ OK" ;;
            broken) HROW="❌ roto — ver issue" ;;
            *) HROW="⚠️ no concluyente" ;;
          esac
          cat > STATUS.md <<EOF
          # Monitor NewPipeExtractor — Necoatube

          > Actualizado automáticamente por el workflow Upstream. Última revisión: $NOW.

          | Señal | Estado | Detalle |
          |---|---|---|
          | Versión | $VROW | tenemos ${{ steps.version.outputs.cur }}, última ${{ steps.version.outputs.lat }} |
          | Salud | $HROW | búsqueda + resolve de video real |

          - [Runs del monitor](https://github.com/totalavance-gif/Necoatube/actions/workflows/upstream.yml)
          - [Issues](https://github.com/totalavance-gif/Necoatube/issues)
          - Revisión automática: lunes 07:20 UTC. Manual: Actions → Upstream → Run workflow.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet && echo "sin cambios" && exit 0
          git commit -m "Monitor: actualización semanal" || exit 0
          git push || echo "push falló (se reintentará en la próxima)"

      - name: Telegram alert
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          VER: ${{ steps.version.outputs.state }}
          HEALTH: ${{ steps.health.outputs.state }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "sin Telegram"; exit 0; fi
          if [ "$VER" != "new" ] && [ "$HEALTH" != "broken" ]; then echo "sin novedad"; exit 0; fi
          MSG="⚠️ Necoatube monitor: versión=$VER salud=$HEALTH https://github.com/totalavance-gif/Necoatube/actions/workflows/upstream.yml"
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d "chat_id=$TG_CHAT" --data-urlencode "text=$MSG" \
            -o /dev/null -w "telegram http=%{http_code}\n"
